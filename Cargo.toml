[workspace]
members = [
    "crates/api",
    "crates/core",
    "crates/worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/mtplayground/alex-3fbk-test-30"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.7", features = ["ws"] }
aws-sdk-s3 = { version = "=1.90.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
image = { version = "0.24", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = { version = "9", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
redis = { version = "0.27", default-features = false, features = ["aio", "connection-manager", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
