[workspace]
members = [
    "crates/api",
    "crates/core",
    "crates/worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/mtplayground/alex-3fbk-test-30"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
aws-sdk-s3 = { version = "=1.90.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "rustls"] }
redis = { version = "0.27", default-features = false, features = ["aio", "connection-manager", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
